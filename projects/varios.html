<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Varios — Máximo Pulitano</title>
<meta name="description" content="Piezas sueltas, exploraciones gráficas y experimentos de diseño y código." />

<meta property="og:type" content="article" />
<meta property="og:url" content="https://maximopulitano.pages.dev/projects/varios.html" />
<meta property="og:title" content="Varios — Máximo Pulitano" />
<meta property="og:description" content="Piezas gráficas, experimentos de código y exploraciones tipográficas: trabajos que no piden un caso de estudio pero merecen mostrarse." />
<meta property="og:image" content="https://maximopulitano.pages.dev/project_images/og-varios.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" type="image/svg+xml" href="../favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@300..600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:      #FFFFFF;
    --ink:     #111111;
    --ink-2:   #3a3a3a;
    --mute:    #888880;
    --line:    #E8E8E8;
    --accent:  #8B1010;
    --display: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --sans:    'Inter Tight', system-ui, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, monospace;
    --bar:     56px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:400;
    font-size:16px;
    line-height:1.6;
  }
  a{color:inherit;text-decoration:none;transition:color .25s}
  a:hover{color:var(--accent)}
  img,video{display:block;max-width:100%;height:auto}

  /* Top bar (fixed) */
  .top{
    position:fixed;
    top:0;left:0;right:0;
    z-index:50;
    height:var(--bar);
    padding:0 clamp(20px, 3vw, 40px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--display);
    font-size:12px;
    font-weight:500;
    letter-spacing:-.01em;
    color:var(--mute);
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }

  /* Page wrapper */
  .wrap{
    padding-top:var(--bar);
    max-width:1400px;
    margin:0 auto;
  }

  /* Intro */
  .intro{
    padding:clamp(56px, 9vw, 130px) clamp(20px, 4vw, 56px) clamp(40px, 5vw, 72px);
    max-width:920px;
  }
  .intro h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(56px, 11vw, 150px);
    line-height:.9;
    letter-spacing:-.04em;
  }
  .intro .sub{
    font-family:var(--mono);
    font-size:13px;
    font-weight:500;
    color:var(--mute);
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-top:18px;
  }
  .intro p{
    font-size:clamp(17px, 1.5vw, 22px);
    font-weight:500;
    line-height:1.5;
    max-width:52ch;
    margin-top:26px;
  }
  .intro p em{font-style:normal;font-weight:700;color:var(--accent)}

  /* Masonry gallery — CSS columns, so mixed aspect ratios pack tightly */
  .gallery{
    padding:0 clamp(12px, 2.5vw, 40px) clamp(60px, 8vw, 120px);
    column-count:4;
    column-gap:clamp(10px, 1.4vw, 18px);
  }
  @media (max-width:1180px){ .gallery{column-count:3} }
  @media (max-width:760px) { .gallery{column-count:2} }
  @media (max-width:440px) { .gallery{column-count:1} }

  .tile{
    display:block;
    width:100%;
    margin:0 0 clamp(10px, 1.4vw, 18px);
    break-inside:avoid;
    border:1px solid var(--line);
    background:#f4f4f4;
    cursor:zoom-in;
    overflow:hidden;
    position:relative;
    line-height:0;
  }
  .tile img{
    width:100%;
    height:auto;
    display:block;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
  }
  /* Fade each image in once it has decoded */
  .tile img:not(.loaded){opacity:0}
  .tile:hover img{transform:scale(1.035)}

  /* Ficha técnica */
  .facts{
    padding:clamp(40px, 5vw, 72px) clamp(20px, 4vw, 56px) clamp(80px, 10vw, 140px);
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(24px, 4vw, 64px);
    align-items:start;
  }
  .facts h2{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(32px, 4.5vw, 64px);
    letter-spacing:-.035em;
    line-height:.95;
  }
  .facts dl{
    display:grid;
    grid-template-columns:130px 1fr;
    column-gap:20px;
    row-gap:12px;
  }
  .facts dt{
    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
    color:var(--mute);
    letter-spacing:.08em;
    text-transform:uppercase;
    padding-top:3px;
  }
  .facts dd{
    font-family:var(--display);
    font-weight:700;
    font-size:17px;
    color:var(--ink);
    line-height:1.3;
    letter-spacing:-.01em;
  }
  .facts .home{
    grid-column:1/-1;
    justify-self:start;
    margin-top:8px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    border:1px solid var(--ink);
    border-radius:999px;
    padding:13px 24px;
    transition:background .2s, color .2s;
  }
  .facts .home:hover{background:var(--ink);color:var(--bg)}
  @media (max-width:760px){ .facts{grid-template-columns:1fr} }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(16px, 4vw, 56px);
    background:rgba(15,10,10,.9);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    opacity:0;
    visibility:hidden;
    transition:opacity .3s ease, visibility .3s;
    cursor:zoom-out;
  }
  .lightbox.show{opacity:1;visibility:visible}
  .lightbox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
    transform:scale(.96);
    transition:transform .3s cubic-bezier(.2,.9,.3,1);
  }
  .lightbox.show img{transform:scale(1)}
  .lightbox .lb-close{
    position:fixed;
    top:clamp(14px, 2vw, 26px);
    right:clamp(14px, 2vw, 26px);
    z-index:101;
    width:44px;height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.3);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox .lb-nav{
    position:fixed;
    top:50%;transform:translateY(-50%);
    z-index:101;
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.3);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox .lb-prev{left:clamp(12px, 2vw, 26px)}
  .lightbox .lb-next{right:clamp(12px, 2vw, 26px)}
  .lightbox .lb-nav:hover,.lightbox .lb-close:hover{background:rgba(255,255,255,.18)}

  ::selection{background:#8B1010;color:#fff}
  ::-moz-selection{background:#8B1010;color:#fff}
</style>
</head>
<body>

<header class="top">
  <a href="../index.html#work">← Portfolio</a>
  <a href="../index.html">Máximo Pulitano</a>
</header>

<main class="wrap">

  <section class="intro">
    <h1>Varios<span style="color:var(--accent)">.</span></h1>
    <p class="sub">Piezas sueltas</p>
    <p>Trabajos, piezas gráficas, experimentos de código y exploraciones tipográficas que quedaron sueltas. Algunas fueron encargos chicos, otras nacieron para probar una idea.</p>
  </section>

  <!-- Gallery — populated from the gd folder -->
  <div class="gallery" id="gallery"></div>

</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lb-close" id="lbClose" aria-label="Cerrar">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior">‹</button>
  <img id="lbImg" alt="" />
  <button class="lb-nav lb-next" id="lbNext" aria-label="Siguiente">›</button>
</div>

<script>
(() => {
  // Every image in ../gd, in display order
  const IMAGES = [
    'estudio1.webp','cadenazzi-estudio-2.webp','cadenazzi-estudio-4.webp','bach-panfleto.webp',
    'helvetica.webp','capsulares-rayo.webp','cables-rayo.webp','lamparas-rayo.webp',
    'recicl-ar.webp','primerosauxiliosleaflet.webp','catsup.webp','fruit.webp',
    'hot.webp','hug.webp','ring.webp','mesh.webp','gradientmap.webp','veins1.webp',
    'cliffs.webp','mountai.webp','medieval.webp','noclowning.webp','koacb.webp','idk2.webp',
    'stnley.webp','stnley2.webp','stnley3.webp','stnley4.webp','stnley6.webp',
    'a.webp','b.webp','c.webp','d.webp','artboard-1.webp','captura-de-pantalla-2022-12-19-112154.webp',
  ];
  const BASE = '../gd/';
  const label = f => f.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');

  const gallery = document.getElementById('gallery');
  gallery.innerHTML = IMAGES.map((f, i) =>
    `<a class="tile" href="${BASE}${encodeURIComponent(f)}" data-i="${i}" aria-label="${label(f)}">` +
      `<img loading="lazy" decoding="async" src="${BASE}${encodeURIComponent(f)}" alt="${label(f)}" />` +
    `</a>`
  ).join('');

  // Fade each tile in once it has actually decoded
  gallery.querySelectorAll('img').forEach(img => {
    const done = () => img.classList.add('loaded');
    if (img.complete) done(); else img.addEventListener('load', done, {once:true});
  });

  // ── Lightbox ───────────────────────────────────────────────────────────────
  const lb    = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  let idx = -1;

  function open(i){
    idx = (i + IMAGES.length) % IMAGES.length;
    lbImg.src = BASE + encodeURIComponent(IMAGES[idx]);
    lbImg.alt = label(IMAGES[idx]);
    lb.classList.add('show');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    lb.classList.remove('show');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  gallery.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    e.preventDefault();
    open(+tile.dataset.i);
  });
  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); open(idx - 1); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); open(idx + 1); });
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target === lbImg) close(); });
  window.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('show')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') open(idx + 1);
    else if (e.key === 'ArrowLeft')  open(idx - 1);
  });
})();
</script>

</body>
</html>
